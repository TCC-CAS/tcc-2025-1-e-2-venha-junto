<!doctype html>
<html lang="pt-br">
  <head><style>html,body{background:#f6f8fc!important}</style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Venha Junto • Redefinição de senha</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/auth-split.css" />
    <style>
      .vj-reqs {
        list-style: none;
        padding: 0;
        margin: 8px 0 0 0;
        font-size: 11px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .vj-req-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
        color: #94a3b8;
      }
      .vj-req-item.valid {
        color: #16a34a;
      }
      .vj-req-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        font-size: 9px;
        font-weight: 900;
        background: #e2e8f0;
        color: #64748b;
      }
      .vj-req-item.valid .vj-req-icon {
        background: #dcfce7;
        color: #16a34a;
      }
      .vj-req-item.missing .vj-req-icon {
        background: #e2e8f0;
        color: #94a3b8;
      }
    </style>
  <script>(function(d){var s = d.createElement('script');s.setAttribute('data-account', 'SEU_ID_AQUI');s.setAttribute('src', 'https://cdn.userway.org/widget.js');(d.body || d.head).appendChild(s);})(document);</script>
</head>

  <body>
    <!-- Split Layout Container -->
    <div class="vj-split-layout">
      <!-- Left side: Orange Hero -->
      <div class="vj-split-left">
        <a href="./usuario-login.html" class="vj-back-btn" aria-label="Voltar para login">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Voltar para login
        </a>
        <div class="vj-split-left-content">
          <h1>Bem-vindo ao Venha Junto</h1>
          <p>Turismo Acessível em São Paulo</p>
        </div>
      </div>

      <!-- Right side: White Form -->
      <div class="vj-split-right">
        <div class="vj-form-container">
          <h2 class="vj-form-title">Esqueci minha senha</h2>
          <p class="vj-form-sub">Informe seu e-mail cadastrado e enviaremos um link para criar uma nova senha.</p>

          <form id="formEsqueciSenha" class="vj-split-form" autocomplete="off" novalidate>
            <div class="vj-form-group">
              <label for="email">E-mail</label>
              <div class="vj-input-wrapper">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                <input id="email" name="email" type="email" placeholder="seu@email.com" required />
              </div>
            </div>

            <p id="formMsg" class="vj-form-msg" style="display:none;padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600;margin:8px 0;"></p>

            <button class="vj-submit-btn" type="submit" style="margin-top: 12px">
              Enviar link <span>→</span>
            </button>
          </form>

          <p style="text-align:center;margin-top:20px;font-size:13px;color:#64748b;">
            Lembrou a senha? <a href="./usuario-login.html" style="color:#F5892A;font-weight:700;">Fazer login</a>
          </p>
        </div>
      </div>
    </div>

    <style>
      .vj-form-msg.success { background:#dcfce7; color:#15803d; display:block !important; }
      .vj-form-msg.error   { background:#fee2e2; color:#b91c1c; display:block !important; }
    </style>
    <script src="../js/usuario-esqueci-senha.js" defer></script>
  </body>
</html>
